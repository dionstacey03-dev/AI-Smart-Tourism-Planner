name: CeylonAI CI

on:
  push:
    branches:
      - upgrade/ceylonai-v2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve dependencies and synchronize lockfile
        run: npm install
      - name: Commit lockfile changes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lock"
            git push
          fi
      - name: Verify lockfile install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
